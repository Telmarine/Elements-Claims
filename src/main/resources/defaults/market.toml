# ============================================================
#  ELEMENTS: CLAIMS  —  market.toml (selling and renting land)
#  Needs Elements: Economy. Switch on in features.toml [market] (both off by default).
#  Prices are whole numbers in the smallest coin of the server's currency (same as Elements: Economy).
# ============================================================

[abandoned]
# Price per chunk for abandoned claims put up for sale.
price_per_chunk = 1000

[rent]
# Rent periods land owners can pick, in days.
periods_days = ["1", "7", "30"]
