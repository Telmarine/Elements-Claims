# ============================================================
#  ELEMENTS: CLAIMS  —  messages
#  Every line a player or admin sees. Colors: &a &l &#FFD700.
#  {prefix} is replaced with general.prefix.
#  Leave a message empty ("") to send nothing.
#  Missing lines use the built-in text, so updates never break this file.
#  Reload with /claims reload.
# ============================================================

[general]
prefix = "&2[Claims]&r "
no_permission = "{prefix}&cYou don't have permission to do that."
disabled = "{prefix}&cThat feature is turned off on this server."
players_only = "{prefix}&cOnly players can do that."
# Shown as the owner of admin claims.
server_name = "the Server"

[claim]
claimed = "{prefix}&aChunk claimed for &f{claim}&a. &7(Chunks claimed: &f{used}&7 / &f{max}&7)"
unclaimed = "{prefix}&eChunk unclaimed from &f{claim}&e. &7(Chunks claimed: &f{used}&7 / &f{max}&7)"
unclaimed_other = "{prefix}&eChunk unclaimed from &f{claim}&e ({owner})."
already_yours = "{prefix}&7This chunk is already part of &f{claim}&7."
taken = "{prefix}&cThis chunk belongs to &f{claim}&c ({owner})."
full = "{prefix}&cYou've claimed all your chunks (&f{used}&c / &f{max}&c). Unclaim a chunk to claim a new one."
too_close = "{prefix}&cToo close to &f{claim}&c. Claims must be at least &f{distance}&c chunks apart."
dimension_blocked = "{prefix}&cLand can't be claimed in this world."
colony = "{prefix}&cThis land belongs to a colony and can't be claimed."
not_claimed = "{prefix}&7This chunk isn't claimed."
not_yours = "{prefix}&cThis chunk is part of &f{claim}&c, which isn't yours."
# Right-click with the Deed inside your own claim.
info_here = "{prefix}&f{claim}&7: &f{chunks}&7 chunks, &f{members}&7 trusted players. Sneak + right-click to unclaim this chunk."
# /claim while standing in a claim.
here = "{prefix}&f{claim}&7 — owner &f{owner}&7, &f{chunks}&7 chunks. Your rank: &f{rank}"
# /claim outside any claim.
list_header = "{prefix}&7Your claims (&f{count}&7) — chunks claimed: &f{used}&7 / &f{max}"
list_line = " &8- &f{claim} &7{chunks} chunks · {dimension} near {x}, {z} · {members} trusted"
list_empty = " &7You have no claims yet. Right-click with your Claim Deed to claim the chunk you stand in."

[deed]
name = "&a&lClaim Deed"
# Lines are split at \n. {used} and {max} update live.
lore = "&7Chunks claimed: &f{used} &7/ &f{max}\n\n&eRight-click&7: claim this chunk\n&eSneak + right-click&7: unclaim this chunk\n&eRight-click in your claim&7: Land Config"
given = "{prefix}&aHere's a new Claim Deed."
already_have = "{prefix}&7You already have a Claim Deed."
first_join = "{prefix}&aYou received a Claim Deed! Right-click to claim the chunk you stand in."
admin_name = "&6&lAdmin Deed"
admin_lore = "&7Claims admin claims (spawn, hubs, jail)\n\n&eRight-click&7: claim this chunk, or open its menu\n&eSneak + right-click&7: unclaim this chunk"
admin_given = "{prefix}&6Here's an Admin Deed."

[protect]
# Shown above the hotbar. {action} comes from [actions] below.
denied = "&cYou can't {action} in &f{claim}&c."
banned = "&cYou are banned from &f{claim}&c."

