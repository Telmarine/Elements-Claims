modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Optional link only. Claims runs without Nexus; Nexus ranks set the claims.limit number node.
[[dependencies.${mod_id}]]
    modId = "elements_nexus"
    type = "optional"
    versionRange = "[1.0.0,)"
    ordering = "NONE"
    side = "SERVER"

# Optional: money for selling and renting land.
[[dependencies.${mod_id}]]
    modId = "elements_economy"
    type = "optional"
    versionRange = "[1.0.0,)"
    ordering = "NONE"
    side = "SERVER"

[[mixins]]
config = "elements_claims.mixins.json"
